version: '3.8'

# ==============================================================================
# Week 11: Containerization with Docker and Docker Compose
# Orchestrates:
#   1. awf-mongodb  - MongoDB Database Service with Persistent Volume
#   2. awf-backend  - Node.js Express REST API + EventEmitter + node-cache
#   3. awf-frontend - React Vite SPA built & served via Nginx Reverse Proxy
# Single command to run entire stack: docker-compose up --build
# ==============================================================================

services:
  # ─── Service 1: MongoDB Database Container ───
  mongodb:
    image: mongo:6.0
    container_name: awf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: student_portfolio
    volumes:
      - mongo-data:/data/db
    networks:
      - awf-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Service 2: Node.js / Express Backend Container ───
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: awf-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/student_portfolio
      - JWT_SECRET=ashvi_antala_24IT001_jwt_secret_key_2026
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awf-network

  # ─── Service 3: React / Vite Frontend Container (Nginx) ───
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: awf-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - awf-network

volumes:
  mongo-data:
    driver: local

networks:
  awf-network:
    driver: bridge
