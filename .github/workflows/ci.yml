name: Full-Stack CI/CD Pipeline (Week 12)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Node.js & EventEmitter)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install Backend Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: 🧪 Run Automated Backend Tests
        working-directory: ./server
        run: npm test

  frontend-build:
    name: Frontend Build & Verification (Vite React)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: 🏗️ Build Frontend Production Bundle
        working-directory: ./client
        run: npm run build

  ci-status:
    name: CI/CD Pipeline Status Reporter
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Report Pipeline Status
        run: |
          echo "================================================="
          echo "🎉 CI/CD Pipeline Executed Successfully!"
          echo "✅ Backend automated tests: PASSED"
          echo "✅ Frontend production build: PASSED"
          echo "📦 Application ready for container deployment (Week 11)"
          echo "================================================="
